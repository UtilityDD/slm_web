<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Download SmartLineman</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap { width: 100%; max-width: 360px; text-align: center; }
    h1 { margin: 0 0 20px; font-size: 1.35rem; }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      background: #f97316;
      color: #fff;
      font-weight: 800;
      border-radius: 999px;
      padding: 14px 16px;
    }
    .meta { margin-top: 14px; font-size: .85rem; color: #64748b; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>SmartLineman</h1>
    <a class="btn" id="apkLink" href="/downloads/smartlineman.apk">Download APK</a>
    <p class="meta" id="versionMeta"></p>
  </main>
  <script>
    fetch('/android-latest.json', { cache: 'no-store' })
      .then((r) => r.ok ? r.json() : null)
      .then((data) => {
        if (!data) return;
        const link = document.getElementById('apkLink');
        const meta = document.getElementById('versionMeta');
        if (data.apk_url) link.href = data.apk_url;
        meta.textContent = 'v' + (data.version_name || '');
      })
      .catch(() => {});
  </script>
</body>
</html>
