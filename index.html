  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';

  <title>SmartLineman</title>
  <script>
    // Capture the install prompt as early as possible: Chrome often fires
    // beforeinstallprompt before the React bundle mounts its listener.
    window.__pwaInstall = { deferred: null, installed: false };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstall.deferred = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaInstall.installed = true;
      window.__pwaInstall.deferred = null;
    });
  </script>
  <style>
    #static-shell {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-height: 100dvh;
      padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
      background: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      transition: opacity 0.2s ease-out;
    }
    #static-shell.static-shell-hide {
      opacity: 0;
      pointer-events: none;
    }
    #static-shell .static-shell-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    #static-shell .static-shell-carousel {
      position: relative;
      width: 11rem;
      height: 11rem;
    }
    @media (min-width: 640px) {
      #static-shell .static-shell-carousel {
        width: 13rem;
        height: 13rem;
      }
    }
    #static-shell .static-shell-carousel img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }
    #static-shell .static-shell-carousel img.is-active {
      opacity: 1;
    }
    #static-shell .static-shell-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    #static-shell .static-shell-dots span {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background: #f97316;
      animation: static-shell-dot-pulse 0.7s ease-in-out infinite;
    }
    #static-shell .static-shell-dots span:nth-child(2) {
      animation-delay: 0.12s;
    }
    #static-shell .static-shell-dots span:nth-child(3) {
      animation-delay: 0.24s;
    }
    @keyframes static-shell-dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    #static-shell-message {
      display: none;
      max-width: 20rem;
      margin: 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      color: #64748b;
      font-weight: 500;
    }
    #static-shell-retry {
      display: none;
      margin: 0;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      background: #f97316;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }
    #static-shell-retry:active {
      transform: scale(0.98);
    }
    #static-shell[data-offline="true"] #static-shell-message,
    #static-shell[data-offline="true"] #static-shell-retry {
      display: block;
    }
    #static-shell[data-offline="true"] .static-shell-inner {
      gap: 1rem;
    }
    #static-shell[data-offline="true"] #static-shell-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
  </style>
</head>

<body>
  <div id="static-shell" data-offline="false" aria-live="polite" aria-busy="true" role="status">
    <div class="static-shell-inner">
      <div class="static-shell-carousel" id="static-shell-carousel" aria-hidden="true">
        <img src="/images/loader/helmet.webp" alt="" class="is-active" decoding="sync" fetchpriority="high" />
      </div>
      <div class="static-shell-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p id="static-shell-message"></p>
      <button type="button" id="static-shell-retry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Retry
      </button>
    </div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      var LOADER_IMAGES = [
        '/images/loader/helmet.webp',
        '/images/loader/goggles.webp',
        '/images/loader/gloves.webp',
        '/images/loader/rubber-gloves.webp',
        '/images/loader/vest.webp',
        '/images/loader/harness.webp',
        '/images/loader/safety-shoes.webp',
        '/images/loader/face-shield.webp',
        '/images/loader/lanyard.webp',
        '/images/loader/ladder.webp',
        '/images/loader/rope.webp',
        '/images/loader/cones.webp',
        '/images/loader/ball-chain.webp',
        '/images/loader/link-chain.webp',
        '/images/loader/caution-tape.webp'
      ];
      var CYCLE_MS = 280;

      function shuffle(list) {
        var arr = list.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = arr[i];
          arr[i] = arr[j];
          arr[j] = tmp;
        }
        return arr;
      }

      var shell = document.getElementById('static-shell');
      var carousel = document.getElementById('static-shell-carousel');
      var msg = document.getElementById('static-shell-message');
      var sequence = shuffle(LOADER_IMAGES);
      var index = Math.floor(Math.random() * sequence.length);

      LOADER_IMAGES.forEach(function (src) {
        var img = new Image();
        img.src = src;
      });

      if (carousel) {
        carousel.innerHTML = '';
        sequence.forEach(function (src, i) {
          var img = document.createElement('img');
          img.src = src;
          img.alt = '';
          img.decoding = 'async';
          if (i === index) img.className = 'is-active';
          carousel.appendChild(img);
        });

        setInterval(function () {
          var imgs = carousel.querySelectorAll('img');
          if (!imgs.length) return;
          imgs[index].classList.remove('is-active');
          index = (index + 1) % imgs.length;
          imgs[index].classList.add('is-active');
        }, CYCLE_MS);
      }

      function updateOfflineState() {
        var online = typeof navigator !== 'undefined' && navigator.onLine;
        if (shell) shell.setAttribute('data-offline', online ? 'false' : 'true');
        if (!msg) return;
        if (!online) {
          msg.textContent =
            "You're offline. Connect to the internet, then tap Retry.";
        } else {
          msg.textContent = '';
        }
      }

      updateOfflineState();
      window.addEventListener('online', updateOfflineState);
      window.addEventListener('offline', updateOfflineState);

      var retry = document.getElementById('static-shell-retry');
      if (retry) {
        retry.addEventListener('click', function () {
          window.location.reload();
        });
      }

      window.__hideStaticShell = function () {
        if (!shell) return;
        shell.classList.add('static-shell-hide');
        shell.setAttribute('aria-busy', 'false');
        window.setTimeout(function () {
          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
        }, 220);
      };
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
