<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0F172A" />
  <!-- App Version: 1.3.70-neural-tts -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="SmartLineman" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>SmartLineman</title>
  <style>
    #static-shell {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-height: 100dvh;
      padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    #static-shell .static-shell-inner {
      max-width: 22rem;
      width: 100%;
    }
    #static-shell .static-shell-spinner-wrap {
      position: relative;
      width: 4rem;
      height: 4rem;
      margin: 0 auto;
    }
    #static-shell .static-shell-spinner {
      width: 4rem;
      height: 4rem;
      box-sizing: border-box;
      border: 4px solid rgba(249, 115, 22, 0.22);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: static-shell-spin 0.85s linear infinite;
    }
    @keyframes static-shell-spin {
      to { transform: rotate(360deg); }
    }
    #static-shell .static-shell-dot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #static-shell .static-shell-dot-inner {
      width: 2rem;
      height: 2rem;
      background: #f97316;
      border-radius: 50%;
      opacity: 0.45;
      animation: static-shell-pulse 1.2s ease-in-out infinite;
    }
    @keyframes static-shell-pulse {
      50% { opacity: 0.12; transform: scale(0.92); }
    }
    #static-shell .static-shell-brand {
      margin-top: 1.5rem;
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }
    #static-shell-message {
      margin-top: 1rem;
      font-size: 0.9375rem;
      line-height: 1.55;
      color: #cbd5e1;
      font-weight: 500;
    }
    #static-shell-retry {
      display: none;
      margin: 1.5rem auto 0;
      padding: 0.875rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(to right, #ea580c, #f97316);
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(234, 88, 12, 0.28);
      font-family: inherit;
    }
    #static-shell-retry:active {
      transform: scale(0.98);
    }
    #static-shell[data-offline="true"] #static-shell-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="static-shell" data-offline="false" aria-live="polite">
      <div class="static-shell-inner">
        <div class="static-shell-spinner-wrap" aria-hidden="true">
          <div class="static-shell-spinner"></div>
          <div class="static-shell-dot">
            <div class="static-shell-dot-inner"></div>
          </div>
        </div>
        <p class="static-shell-brand">Smart Lineman</p>
        <p id="static-shell-message"></p>
        <button type="button" id="static-shell-retry">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Retry
        </button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var shell = document.getElementById('static-shell');
      var msg = document.getElementById('static-shell-message');
      function update() {
        var online = typeof navigator !== 'undefined' && navigator.onLine;
        if (shell) shell.setAttribute('data-offline', online ? 'false' : 'true');
        if (!msg) return;
        if (online) {
          msg.textContent =
            'Loading Smart Lineman. If this message stays for a long time, check your internet connection and try refreshing the page.';
        } else {
          msg.textContent =
            "You're offline. The first time you open this page (or after an update), you need the internet so the app can download. Connect to Wi‑Fi or mobile data, then tap Retry. If you already added Smart Lineman to your home screen, try opening it from there.";
        }
      }
      update();
      window.addEventListener('online', update);
      window.addEventListener('offline', update);
      var retry = document.getElementById('static-shell-retry');
      if (retry) {
        retry.addEventListener('click', function () {
          window.location.reload();
        });
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('Suraksha Sathi Offline Mode Active');
        }).catch(err => {
          console.log('Offline mode failed', err);
        });
      });
    }
  </script>
</body>

</html>
