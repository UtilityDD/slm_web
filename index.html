  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SmartLineman" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="খেলতে খেলতে শিখুন, শিখতে শিখতে পুরস্কার পান এবং নিজেকে স্মার্ট বানান—পশ্চিমবঙ্গের লাইনম্যানদের জন্য।" />

  <meta property="og:description" content="নিরাপত্তা শিখুন, কুইজ খেলুন, পুরস্কার পান এবং নিজেকে আরও স্মার্ট করে তুলুন। যোগদান বিনামূল্যে।" />

    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=swap"
    rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 18px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20;
    }
  </style>
  <title>SmartLineman</title>
  <script>
    // Capture the install prompt as early as possible: Chrome often fires
    // beforeinstallprompt before the React bundle mounts its listener.
    window.__pwaInstall = { deferred: null, installed: false };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstall.deferred = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaInstall.installed = true;
      window.__pwaInstall.deferred = null;
    });
  </script>
  <style>
    #static-shell {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-height: 100dvh;
      padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
      /* Default cream — matches Landing / NativeAppTopBar (no navy flash) */
      background: #fffdf7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      transition: opacity 0.28s ease-out;
    }
    #static-shell.static-shell-hide {
      opacity: 0;
      pointer-events: none;
    }
    #static-shell .static-shell-inner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    #static-shell .static-shell-brand {
      margin: 0;
      font-size: clamp(1.85rem, 6.5vw, 2.75rem);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 1;
      color: #0f172a;
    }
    #static-shell .static-shell-brand span {
      color: #f97316;
      letter-spacing: -0.03em;
    }
    #static-shell .static-shell-spinner {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 9999px;
      border: 2px solid #fed7aa;
      border-top-color: #f97316;
      animation: static-shell-spin 0.9s linear infinite;
    }
    @keyframes static-shell-spin {
      to { transform: rotate(360deg); }
    }
    #static-shell-message {
      display: none;
      max-width: 20rem;
      margin: 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      color: #64748b;
      font-weight: 500;
    }
    #static-shell-retry {
      display: none;
      margin: 0;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      background: #f97316;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }
    #static-shell-retry:active {
      transform: scale(0.98);
    }
    /* Native: wordmark only (same as AppBootSplash) */
    #static-shell[data-native="true"] .static-shell-inner {
      display: flex;
    }
    #static-shell[data-native="true"] .static-shell-spinner {
      display: none;
    }
    /* Browser / PWA — cream + quiet spinner */
    #static-shell[data-web="true"] {
      background: #fffdf7;
    }
    #static-shell[data-web="true"] .static-shell-inner {
      display: flex;
    }
    #static-shell[data-web="true"] .static-shell-brand {
      display: none;
    }
    #static-shell[data-offline="true"] #static-shell-message,
    #static-shell[data-offline="true"] #static-shell-retry {
      display: block;
    }
    #static-shell[data-offline="true"] .static-shell-inner {
      display: flex;
      gap: 1rem;
    }
    #static-shell[data-offline="true"] #static-shell-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    #static-shell[data-native="true"][data-offline="true"] #static-shell-message {
      color: #9a3412;
    }
  </style>
</head>

<body>
  <div id="static-shell" data-offline="false" aria-live="polite" aria-busy="true" role="status">
    <div class="static-shell-inner">
      <p class="static-shell-brand">SmartLineMan<span>.in</span></p>
      <div class="static-shell-spinner" aria-hidden="true"></div>
      <p id="static-shell-message"></p>
      <button type="button" id="static-shell-retry">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Retry
      </button>
    </div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      var shell = document.getElementById('static-shell');
      var msg = document.getElementById('static-shell-message');

      function detectNative() {
        try {
          var cap = window.Capacitor;
          if (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) {
            return true;
          }
        } catch (e) { /* ignore */ }
        var ua = navigator.userAgent || '';
        var host = (window.location && window.location.hostname) || '';
        // Capacitor Android WebView
        if (/Android/i.test(ua) && (/; wv\)/i.test(ua) || /localhost/i.test(host))) {
          return true;
        }
        return false;
      }

      var isNative = detectNative();
      if (shell) {
        if (isNative) {
          shell.setAttribute('data-native', 'true');
          document.documentElement.style.background = '#FFFDF7';
          document.body.style.background = '#FFFDF7';
        } else {
          shell.setAttribute('data-web', 'true');
          document.documentElement.style.background = '#fffdf7';
          document.body.style.background = '#fffdf7';
        }
      }

      function updateOfflineState() {
        var online = typeof navigator !== 'undefined' && navigator.onLine;
        if (shell) shell.setAttribute('data-offline', online ? 'false' : 'true');
        if (!msg) return;
        if (!online) {
          msg.textContent =
            "You're offline. Connect to the internet, then tap Retry.";
        } else {
          msg.textContent = '';
        }
      }

      updateOfflineState();
      window.addEventListener('online', updateOfflineState);
      window.addEventListener('offline', updateOfflineState);

      var retry = document.getElementById('static-shell-retry');
      if (retry) {
        retry.addEventListener('click', function () {
          window.location.reload();
        });
      }

      window.__hideStaticShell = function () {
        if (!shell) return;
        shell.classList.add('static-shell-hide');
        shell.setAttribute('aria-busy', 'false');
        window.setTimeout(function () {
          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
        }, isNative ? 320 : 220);
      };
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
